name: Build & Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  REGISTRY: registry.digitalocean.com/karmahacker
  IMAGE_NAME: message-classifier

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Login to DO Registry
        run: doctl registry login --expiry-seconds 1200
      - name: Set image tag
        run: echo "IMAGE_TAG=PR-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
      - name: Build & push
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
      - name: Update GitOps
        env:
          GH_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
        run: |
          BRANCH="deploy/${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}"
          git clone https://x-access-token:${GH_TOKEN}@github.com/karmahacker/k8s-cluster.git /tmp/k8s-cluster
          cd /tmp/k8s-cluster
          find apps/llama-cpp -name "*.yaml" -exec sed -i "s|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:[^ ]*|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" {} +
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Deploy ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          git push origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "Deploy ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            --body "Auto-deploy from ${{ github.event.repository.full_name }} PR #${{ github.event.pull_request.number }}" \
            --repo karmahacker/k8s-cluster
          gh pr merge "$BRANCH" --merge --admin --repo karmahacker/k8s-cluster

      - name: Notify Telegram (deploy)
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="🚀 *${{ github.event.repository.name }}* deployed from PR #${{ github.event.pull_request.number }}"
          else
            MSG="❌ *${{ github.event.repository.name }}* deploy FAILED for PR #${{ github.event.pull_request.number }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode=Markdown \
            -d text="$MSG"
